# Internal buff applied by the C++ script to each legion demon. Not player-facing.
# The C++ (spell_demonology_demonic_empowerment) sets every amount + the duration live per
# the Phase 4 spine talents; the base_points here are only defaults. The 3rd effect is the
# Shadowflame Legion absorb shield (amount 0 unless sl is trained).
key: demonology.demonic_empowerment_buff
clone_from: 47193
name: Demonic Empowerment
description: "Hastened and empowered by your command."
duration: 12s
# NOT passive — passive would hide the buff icon. This is applied by the C++
# script (spell_demonology_demonic_empowerment) onto each demon.
effects:
  - {effect: apply_aura, aura: mod_damage_percent_done, base_points: 20, target_a: unit_caster, misc: 127}
  - {effect: apply_aura, aura: mod_melee_ranged_haste, base_points: 30, target_a: unit_caster}
  - {effect: apply_aura, aura: school_absorb, base_points: 0, target_a: unit_caster, misc: 127}
# AuraScript for Ruinous Empowerment's refresh-on-expiry (the leech half is in C++).
server:
  script: spell_demonology_empowerment_buff
