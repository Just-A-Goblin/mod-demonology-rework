# Enthralling Presence — the Succubus anchor signature (DESIGN_V2 §5.5). A short enemy
# debuff: attack-speed slow (daze) + move slow (snare), so boss/flag mechanic immunities
# apply to the control halves for free. Applied by the C++ dispatcher to each enemy within
# 8yd of the anchor's target; the imperative threat drop (owner + pooled demons) is done
# in C++, not here. Single-target aura carrier — C++ handles the 8yd spread.
# Cloned from Dazed (1604), a real move-slow DEBUFF, so the client files it in the debuff
# slot (cloning the beneficial Demonic Empowerment made it a hidden enemy "buff" — the slow
# still worked but showed no debuff icon). Bumped to 4s so the window is visible/useful.
key: demonology.enthralling_presence
clone_from: 1604
icon: "Spell_Shadow_Charm"
name: Enthralling Presence
description: "Enthralled by the Succubus: attack and movement speed reduced."
duration: 4s
range: 30yd
effects:
  - {effect: apply_aura, aura: mod_decrease_speed, base_points: -30, target_a: unit_target_enemy, mechanic: snare}
  - {effect: apply_aura, aura: mod_melee_haste,    base_points: -27, target_a: unit_target_enemy, mechanic: daze}
