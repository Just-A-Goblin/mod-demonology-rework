# Summon Imp Legionnaire — adds an Imp guardian to your command pool (does NOT
# replace your anchor pet). Cloned from Demonic Empowerment (47193), NOT a pet
# summon: cloning the real pet-summon spells makes the CLIENT treat this as a pet
# summon and dismiss your anchor on cast. Icon set explicitly to the Imp summon
# icon. The shared SpellScript recruits the guardian + charges Soul Shards.
key: demonology.summon_legionnaire_imp
clone_from: 47193
icon: "Spell_Shadow_SummonImp"
name: Summon Imp Legionnaire
# No over-head skull: override the inherited Demonic Empowerment (47193) SpellVisual (its state kit
# is the flaming skull on the caster) with the classic warlock demon-summon visual (Summon Voidwalker,
# 697). SpellVisualID is client-only, so this is a client-patch change — the server never renders it.
visual: {copy_from: 697}
description: "Summons an Imp to serve in your legion, fighting alongside your other demons."
cast_time: 1.5s
cooldown: 0s
range: 0yd
# Mimics the anchor pet summon pattern: mana cost + cast time + a Soul Shard reagent (all native,
# shown in the tooltip; the core checks/consumes them). Mana = 75% of Summon Imp (64% -> 48% base).
power: {type: mana, percent_of_base: 48}
reagents: [{item: 6265, count: 1}]   # Soul Shard
effects:
  - {effect: dummy, target_a: unit_caster}
server:
  script: spell_demonology_summon_legionnaire
learn:
  class: warlock
  skill_line: 354   # appear in the Demonology spellbook tab
