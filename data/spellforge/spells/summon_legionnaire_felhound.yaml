# Summon Felhound Legionnaire — adds a Felhunter guardian to your command pool
# (does NOT replace your anchor pet). Cloned from Demonic Empowerment (47193), NOT
# a pet summon (cloning real pet summons makes the client dismiss the anchor on
# cast). Icon set explicitly. Shared SpellScript recruits + charges Soul Shards.
key: demonology.summon_legionnaire_felhound
clone_from: 47193
icon: "Spell_Shadow_SummonFelHunter"
name: Summon Felhound Legionnaire
# No over-head skull: override the inherited Demonic Empowerment (47193) SpellVisual with the classic
# warlock demon-summon visual (Summon Voidwalker, 697). SpellVisualID is client-only (client patch).
visual: {copy_from: 697}
description: "Summons a Felhunter to serve in your legion, fighting alongside your other demons."
cast_time: 1.5s
cooldown: 0s
range: 0yd
# Mimics the anchor pet summon: mana + cast time + Soul Shard reagent (native tooltip/consume).
# Mana = 75% of Summon Felhunter (80% -> 60% base).
power: {type: mana, percent_of_base: 60}
reagents: [{item: 6265, count: 1}]   # Soul Shard
effects:
  - {effect: dummy, target_a: unit_caster}
server:
  script: spell_demonology_summon_legionnaire
learn:
  class: warlock
  skill_line: 354   # appear in the Demonology spellbook tab
