icon: "Spell_Fire_Immolation"
name: Infernal Command Pulse
description: "The Infernal slams the ground, searing nearby enemies with fel fire."
school: [fire]
range: 0yd
# Borrow Fire Nova's (1535) look so it reads as a fire nova burst, not the shadow
